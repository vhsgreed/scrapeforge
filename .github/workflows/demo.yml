name: demo

# Re-records docs/demo.gif from docs/demo.tape against the live sandbox
# site and commits it to the branch the workflow ran on.
on:
  workflow_dispatch:
  push:
    paths:
      - "docs/demo.tape"
      - ".github/workflows/demo.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape
      - name: commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git diff --cached --quiet || git commit -m "docs: re-record demo.gif"
          git push
