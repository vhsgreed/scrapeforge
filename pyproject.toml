[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapeforge"
dynamic = ["version"]
description = "Probe-first, tiered Python scraper: classify anti-bot defenses, fetch with the cheapest tier that works, extract via YAML + CSS selectors, verify row counts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.29",
    "curl_cffi>=0.7,<0.17",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Tier 3 is optional and heavy; install only when a probe says it is needed.
tier3 = ["scrapling"]
dev = ["pytest>=8"]

[project.scripts]
scrapeforge = "scrapeforge.cli:main"

[project.urls]
Homepage = "https://github.com/vhsgreed/scrapeforge"

[tool.setuptools]
packages = ["scrapeforge"]

[tool.setuptools.dynamic]
version = { attr = "scrapeforge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
